[package]
name = "client_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
bevy = { workspace = true, features = [
    "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_color",
    "bevy_core_pipeline", "bevy_render", "bevy_pbr", "bevy_mesh", "bevy_image",
    "bevy_camera", "bevy_light", "bevy_shader", "bevy_log", "bevy_window",
    "bevy_winit", "x11", "wayland", "png", "bevy_audio", "wav", "bevy_remote",
    "tonemapping_luts", "ui", "complex_script_segmentation", "bevy_animation", "zstd_rust",
] }
serde.workspace = true
serde_json.workspace = true
shared = { path = "../shared" }
midnight_map_data = { path = "../map_data" }
midnight_ui_data = { path = "../ui_data" }
skrifa = "0.44"
midnight_network = { path = "../network" }

[dev-dependencies]
sha2 = "0.10"
ttf-parser = { version = "0.25", default-features = false }

