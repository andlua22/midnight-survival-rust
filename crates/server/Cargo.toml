[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "server"

[dependencies]
bevy = { workspace = true, features = ["std", "async_executor"] }
shared = { path = "../shared" }
midnight_network = { path = "../network" }
