[package]
name = "terrain_shader_evidence_probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace]

[dependencies]
unity-asset-binary = "0.2.0"
unity-asset-core = "0.2.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde_json = "1"

[[bin]]
name = "dump-terrain-shader-metadata"
path = "../dump_terrain_shader_metadata.rs"

[[bin]]
name = "extract-terrain-glsles"
path = "../extract_terrain_glsles.rs"
