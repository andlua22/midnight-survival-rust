[workspace]
members = ["crates/map_data", "crates/ui_data", "crates/shared", "crates/network", "crates/server", "crates/client_core", "crates/client_runner"]
exclude = ["tools/core_checks", "tools/asset_unpacker"]
resolver = "3"
default-members = ["crates/client_runner"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
bevy = { version = "0.20.1", default-features = false }
bevy_egui = { version = "0.43.1", default-features = false, features = ["default_fonts", "render"] }
bevy_rapier3d = { version = "0.37.0", default-features = false, features = ["dim3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

