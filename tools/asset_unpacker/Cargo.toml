[package]
name = "asset_unpacker"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
unity-asset-binary = "0.2.0"
unity-asset-core = "0.2.0"
unity-asset-decode = { version = "0.2.0", features = ["texture-advanced"] }
midnight_map_data = { path = "../../crates/map_data" }
glam = "0.30"
half = "2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
texture2ddecoder = "0.1.2"
